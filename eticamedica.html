<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HISPAMUN XIV - Panel Único</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #343a40;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
    }
    .container {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    input {
      padding: 10px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      width: 250px;
    }
    button {
      padding: 10px 15px;
      margin: 5px 3px;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }
    .btn-azul { background-color: #007bff; }
    .btn-verde { background-color: #28a745; }
    .btn-rojo { background-color: #dc3545; }
    .btn-amarillo { background-color: #ffc107; color: black; }

    .delegados-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      width: 280px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .bandera {
      width: 24px;
      height: 18px;
      vertical-align: middle;
      margin-right: 5px;
    }
    select {
      width: 100%;
      padding: 6px;
      border-radius: 6px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <header>Panel de Control - HISPAMUN XIV</header>
  <div class="container">
    <input type="text" id="nombre" placeholder="Nombre del delegado">
    <input type="text" id="pais" placeholder="País (ej: Colombia)">
    <button class="btn-verde" onclick="agregarDelegado()">Agregar Delegado</button>
    <button class="btn-azul" onclick="mostrarLista()">Ver Lista</button>
    <div class="delegados-grid" id="contenedorDelegados"></div>
  </div>

  <script>
    let delegados = JSON.parse(localStorage.getItem('delegados')) || [];
    let intervalos = {};

    function guardarDelegados() {
      localStorage.setItem('delegados', JSON.stringify(delegados));
    }

    function obtenerBandera(pais) {
      return `https://flagcdn.com/48x36/${pais.trim().toLowerCase().slice(0,2)}.png`;
    }

    function agregarDelegado() {
      const nombre = document.getElementById("nombre").value.trim();
      const pais = document.getElementById("pais").value.trim();
      if (!nombre || !pais) return alert("Completa todos los campos");

      const nuevo = {
        id: Date.now(),
        nombre,
        pais,
        intervenciones: 0,
        puntajes: [],
        amonestaciones: 0,
        tiempo: 0
      };

      delegados.push(nuevo);
      guardarDelegados();
      renderDelegados();
      document.getElementById("nombre").value = "";
      document.getElementById("pais").value = "";
    }

    function renderDelegados() {
      const contenedor = document.getElementById("contenedorDelegados");
      contenedor.innerHTML = "";

      delegados.forEach(d => {
        const promedio = d.puntajes.length ? (d.puntajes.reduce((a,b)=>a+b,0)/d.puntajes.length).toFixed(2) : "N/A";
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <strong><img class="bandera" src="${obtenerBandera(d.pais)}"> ${d.nombre} (${d.pais})</strong>
          <p>Intervenciones: ${d.intervenciones}</p>
          <button class="btn-azul" onclick="intervencion(${d.id})">+ Intervención</button>
          <select id="puntaje-${d.id}">
            <option value="">-- Puntuar --</option>
            <option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option><option value="5">5</option>
          </select>
          <p>Promedio: ${promedio}</p>
          <p>Tiempo: ${formatearTiempo(d.tiempo + (d._inicio ? Date.now() - d._inicio : 0))}</p>
          <button class="${d._activo ? 'btn-rojo' : 'btn-verde'}" onclick="iniciarTiempo(${d.id})">${d._activo ? 'Detener' : 'Iniciar'}</button>
          <button class="btn-azul" onclick="reiniciarTiempo(${d.id})">Reiniciar</button>
          <p class="${d.amonestaciones > 0 ? 'btn-amarillo' : ''}">Amonestaciones: ${d.amonestaciones}</p>
          <button class="btn-amarillo" onclick="amonestar(${d.id})">+ Amonestación</button>
        `;
        contenedor.appendChild(card);
      });
    }

    function intervencion(id) {
      const d = delegados.find(d => d.id === id);
      const valor = parseInt(document.getElementById(`puntaje-${id}`).value);
      if (!valor) return alert("Selecciona una puntuación válida");
      d.intervenciones++;
      d.puntajes.push(valor);
      guardarDelegados();
      renderDelegados();
    }

    function amonestar(id) {
      const d = delegados.find(d => d.id === id);
      d.amonestaciones++;
      guardarDelegados();
      renderDelegados();
    }

    function iniciarTiempo(id) {
      const d = delegados.find(d => d.id === id);
      if (!d) return;

      if (intervalos[id]) {
        clearInterval(intervalos[id]);
        d.tiempo += Date.now() - d._inicio;
        d._activo = false;
        delete d._inicio;
        delete intervalos[id];
      } else {
        d._inicio = Date.now();
        d._activo = true;
        intervalos[id] = setInterval(() => renderDelegados(), 1000);
      }

      guardarDelegados();
      renderDelegados();
    }

    function reiniciarTiempo(id) {
      const d = delegados.find(d => d.id === id);
      if (!d) return;

      if (intervalos[id]) {
        clearInterval(intervalos[id]);
        delete intervalos[id];
      }

      d.tiempo = 0;
      d._activo = false;
      delete d._inicio;
      guardarDelegados();
      renderDelegados();
    }

    function formatearTiempo(ms) {
      const minutos = String(Math.floor(ms / 60000)).padStart(2, "0");
      const segundos = String(Math.floor((ms % 60000) / 1000)).padStart(2, "0");
      return `${minutos}:${segundos}`;
    }

    function mostrarLista() {
      alert(delegados.map(d => `${d.nombre} (${d.pais})`).join("\n"));
    }

    renderDelegados();
  </script>
</body>
</html>
